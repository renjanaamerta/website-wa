<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hubungi kami melalui WhatsApp.">
  <meta name="theme-color" content="#25D366">
  <title>Hubungi Kami</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#0f172a,#1e293b);color:#fff}
    .wrap{width:min(100%,460px);text-align:center}
    .card{padding:38px 24px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(255,255,255,.08);box-shadow:0 24px 70px rgba(0,0,0,.35);backdrop-filter:blur(16px)}
    .avatar{width:88px;height:88px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:#25D366;font-size:40px;box-shadow:0 10px 30px rgba(37,211,102,.25)}
    h1{margin:0 0 10px;font-size:30px;letter-spacing:-.5px}
    p{margin:0 auto 26px;max-width:360px;color:#cbd5e1;line-height:1.6}
    .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 20px;border-radius:15px;background:#25D366;color:#fff;text-decoration:none;font-weight:800;font-size:17px;transition:.2s}
    .btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
    .wa-icon{font-size:22px}
    .number{margin-top:16px;color:#94a3b8;font-size:14px}
    .footer{margin-top:18px;color:#64748b;font-size:12px}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="avatar">💬</div>
      <h1>Hubungi Kami</h1>
      <p>Ada pertanyaan atau ingin mendapatkan informasi lebih lanjut? Silakan hubungi kami melalui WhatsApp.</p>
      <a class="btn" href="https://wa.me/6281998714500" target="_blank" rel="noopener noreferrer">
        <span class="wa-icon">◉</span>
        Chat via WhatsApp
      </a>
      <div class="number">0819 9871 4500</div>
    </section>
    <div class="footer">Terima kasih sudah berkunjung.</div>
  </main>
</body>
</html>
