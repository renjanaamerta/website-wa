<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renjana Amerta — Photography</title><link rel="icon" href="logo.jpeg">
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0c10;color:#f4f1eb;font-family:Arial,sans-serif}a{text-decoration:none;color:inherit}
.wrap{width:min(1100px,92%);margin:auto}.hero{min-height:90vh;display:grid;place-items:center;text-align:center;padding:50px 0;background:linear-gradient(#080a0dcc,#080a0de8),url('background.jpeg') center/cover}
.logo{width:100px;height:100px;object-fit:contain}.eyebrow{letter-spacing:.25em;font-size:12px;color:#c9c2b4}.hero h1,.section-title{font-family:Georgia,serif;font-weight:500}.hero h1{font-size:clamp(42px,9vw,78px);margin:12px 0}.hero p{max-width:650px;margin:15px auto 30px;color:#ccc;line-height:1.7}.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{padding:13px 20px;border-radius:999px;border:1px solid #777;background:#eee;color:#111;font-weight:bold}.btn.alt{background:transparent;color:#eee}section{padding:75px 0}.section-title{font-size:40px;margin:8px 0}.muted{color:#999;line-height:1.7}.filters{display:flex;gap:8px;overflow:auto;padding:20px 0}.filter{padding:9px 14px;border-radius:999px;border:1px solid #383d46;background:#11151b;color:#ddd}.filter.active{background:#eee;color:#111}.gallery{columns:3 260px;column-gap:14px}.card{break-inside:avoid;margin-bottom:14px;background:#151820;border-radius:8px;overflow:hidden}.card img{display:block;width:100%}.caption{padding:12px}.caption small{color:#888}.form{display:grid;gap:12px;max-width:720px}.form input,.form select,.form textarea{width:100%;padding:14px;background:#11151b;color:#fff;border:1px solid #363a42;border-radius:8px}.form textarea{min-height:120px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}footer{border-top:1px solid #25282e;padding:35px;text-align:center;color:#777}@media(max-width:650px){.two{grid-template-columns:1fr}}
</style></head><body>
<header class="hero"><div class="wrap"><img class="logo" src="logo.jpeg" alt="Renjana Amerta"><div class="eyebrow">RENJANA AMERTA</div><h1>Photography</h1><p>Mengabadikan cerita, suasana, dan momen yang ingin kamu ingat selamanya.</p><div class="btns"><a id="wa" class="btn">WhatsApp</a><a class="btn alt" href="#portfolio">Portfolio</a><a class="btn alt" href="#booking">Booking</a></div></div></header>
<main><section id="portfolio"><div class="wrap"><div class="eyebrow">OUR WORK</div><h2 class="section-title">Portfolio</h2><p class="muted">Koleksi karya Renjana Amerta.</p><div id="filters" class="filters"></div><div id="gallery" class="gallery"><p class="muted">Memuat portfolio...</p></div></div></section>
<section id="booking"><div class="wrap"><div class="eyebrow">RESERVATION</div><h2 class="section-title">Booking</h2><form id="bookingForm" class="form"><div class="two"><input id="name" required placeholder="Nama"><input id="phone" required placeholder="Nomor WhatsApp"></div><div class="two"><select id="type" required><option value="">Jenis sesi</option><option>Wedding</option><option>Prewedding</option><option>Couple</option><option>Portrait</option><option>Event</option><option>Lainnya</option></select><input id="date" type="date" required></div><div class="two"><input id="location" placeholder="Lokasi"><input id="package" placeholder="Paket"></div><textarea id="notes" placeholder="Catatan"></textarea><button class="btn">Kirim Booking via WhatsApp</button><div id="msg" class="muted"></div></form></div></section></main>
<footer>© <span id="year"></span> Renjana Amerta Photography</footer>
<script src="config.js"></script><script>
const c=window.RENJANA_CONFIG,esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
wa.href=`https://wa.me/${c.WHATSAPP_NUMBER}`;year.textContent=new Date().getFullYear();
async function load(){try{let r=await fetch(`${c.SUPABASE_URL}/rest/v1/portfolio?select=*&published=eq.true&order=sort_order.asc,created_at.desc`,{headers:{apikey:c.SUPABASE_PUBLISHABLE_KEY}});if(!r.ok)throw 0;let rows=await r.json(),cats=['Semua',...new Set(rows.map(x=>x.category).filter(Boolean))];filters.innerHTML=cats.map((x,i)=>`<button class="filter ${i?'':'active'}" data-c="${esc(x)}">${esc(x)}</button>`).join('');let render=cat=>{let a=cat==='Semua'?rows:rows.filter(x=>x.category===cat);gallery.innerHTML=a.length?a.map(x=>{let u=x.image_path?.startsWith('http')?x.image_path:`${c.SUPABASE_URL}/storage/v1/object/public/portfolio/${x.image_path||''}`;return `<article class="card"><img loading="lazy" src="${u}" alt="${esc(x.title)}"><div class="caption"><b>${esc(x.title)}</b><br><small>${esc(x.category)}</small></div></article>`}).join(''):'<p class="muted">Belum ada portfolio yang dipublish.</p>'};render('Semua');filters.onclick=e=>{if(e.target.matches('.filter')){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.c)}}}catch(e){gallery.innerHTML='<p class="muted">Portfolio belum dapat dimuat.</p>'}}load();
bookingForm.onsubmit=e=>{e.preventDefault();let m=`Halo Renjana Amerta, saya ingin booking.%0A%0ANama: ${encodeURIComponent(name.value)}%0AWhatsApp: ${encodeURIComponent(phone.value)}%0AJenis: ${encodeURIComponent(type.value)}%0ATanggal: ${encodeURIComponent(date.value)}%0ALokasi: ${encodeURIComponent(location.value)}%0APaket: ${encodeURIComponent(package.value)}%0ACatatan: ${encodeURIComponent(notes.value)}`;open(`https://wa.me/${c.WHATSAPP_NUMBER}?text=${m}`,'_blank');msg.textContent='Membuka WhatsApp...'};
</script></body></html>
